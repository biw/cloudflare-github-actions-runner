name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.runner_index }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner_index: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-linux-x64-node-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-linux-x64-node-22-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Save pnpm cache
        if: matrix.runner_index == 1 && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-linux-x64-node-22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Check
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Check published package contents
        run: npm pack --dry-run

  runner-image-size:
    name: Runner image under 1.5 GB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and check runner image size
        run: ./tests/runner-image-size.sh

  publish:
    needs:
      - ci
      - runner-image-size
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      id-token: write
