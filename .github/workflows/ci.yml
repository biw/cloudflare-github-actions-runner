name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.runner_index }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner_index: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-linux-x64-node-26-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-linux-x64-node-26-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Save pnpm cache
        if: matrix.runner_index == 1 && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-linux-x64-node-26-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Check
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Check published package contents
        run: npm pack --dry-run

  runner-image-size:
    name: Runner image under 1.5 GB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check runner image size
        run: ./tests/runner-image-size.sh

  publish:
    needs:
      - ci
      - runner-image-size
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      id-token: write
